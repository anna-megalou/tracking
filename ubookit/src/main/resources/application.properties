spring.application.name=ubookit

# Activate the local profile to load application-local.properties (DB credentials)
spring.profiles.active=local

# Database connection - overridden by application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/ubookit
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialize database with data.sql on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
